[package]
name = "axiom-demo-sql-over-redis"
version = "0.3.0"
edition = "2024"
# Edition 2024 stabilized in Rust 1.85 (Feb 2025); matches core/runtime/instances.
rust-version = "1.98"
description = "axiom comprehensive demo (cross-layer use case): planned lib + thin per-driver bins + equivalence cross-checks. First use case = SQL-over-Redis (the Redis protocol face × the psql computation face over one composition core); sync by default, the tokio variant driven truly asynchronously via axiom-instances."
license = "Apache-2.0"
repository = "https://github.com/ghwinter/axiom"
homepage = "https://github.com/ghwinter/axiom"
documentation = "https://docs.rs/axiom-demo-sql-over-redis"
keywords = ["dataflow", "composite", "demo", "sql", "redis", "async"]
categories = ["concurrency", "database", "asynchronous"]

[dependencies]
# Dependency direction is one-way: axiom ← axiom-semantics ← axiom-instances
# ← the use-case crate (enforced by the workspace member table).
# Located at examples/sql-over-redis/: the root core package and sibling
# crates are two levels up.
axiom = { path = "../../core", version = "0.3.0", default-features = false }
axiom-semantics = { path = "../../semantics", version = "0.3.0" }
axiom-instances = { path = "../../instances", version = "0.3.0", default-features = false }

[features]
default = []                       # sync demo: zero third-party (pure semantics driver)
tokio = ["axiom-instances/tokio", "dep:tokio"]  # async demo: true async driver + channel feeding
# 对抗性 T6 交叉验证：确定性仿真载体（turmoil 镜像 tokio::net）作为同一 async 蓝图的
# 第三物理域——`src/net.rs` 在 feature 处切换 net 类型；测试 `tests/tcp_sim_adversarial.rs`。
turmoil = ["axiom-instances/tokio", "dep:tokio", "dep:turmoil"]

[dependencies.tokio]
version = "1"
optional = true
default-features = false
# 既有：time+rt-multi-thread+sync（并发等待/馈入）；增 net（实际 TCP 套接字）、
# io-util（AsyncRead/AsyncWriteExt）、macros（#[tokio::main]/#[tokio::test]）。
features = ["time", "rt-multi-thread", "sync", "net", "io-util", "macros"]

# 仿真载体：tokio-rs 官方确定性仿真框架（单线程模拟主机/时间/网络，rng_seed 可复现）。
# 仅 `turmoil` feature 下进入编译（`src/net.rs` 切换 net 类型用）。
[dependencies.turmoil]
version = "0.7"
optional = true
default-features = false

# ── Benchmarks (build use cases, kept) ──────────────────────────────────────
[[bench]]
name = "latency"
harness = false