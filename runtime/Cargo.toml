[package]
name = "axiom-runtime"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "axiom 的物理层实现用例（载体 Carrier）：为四构件编译期核心（cell_core）提供'值如何跨连接流动'的多种可替换物理方案——栈上内联(Inline)、队列/通道(Queue)、有界背压(Bounded)、跨线程流(spawned_flow)。模块化、可替换，作为未来 axiom-tokio 等第三方物理适配器的模板。"
license = "MIT"
repository = "https://github.com/ghwinter/axiom"
homepage = "https://github.com/ghwinter/axiom"
documentation = "https://docs.rs/axiom-runtime"
keywords = ["dataflow", "carrier", "zero-cost", "compile-time", "execution"]
categories = ["concurrency", "rust-patterns", "embedded"]

[dependencies]
# 默认 no_std：runtime 的 `std` feature 显式映射 `axiom/std`，使 "no_std 组合" 在依赖层闭合。
axiom = { path = "..", version = "0.3.0", default-features = false }

[features]
default = ["std", "event", "async-seam", "telemetry"]
std = ["axiom/std"]
# ── 接缝载体族（结构收敛 2026-08：细粒度门控＋伞默认）────────────
# 默认全开（保持现状编译面）；按需取用者可 `--no-default-features` 只取核心族
# （carrier/contract/obligation/flow/profile/slot/delivery/law 等），或单特性
# 选接缝。门控纪律：账本探针引用符号必须与其模块同门控（obligation.rs
# `event::pump_events` 行随 `event`）；CI 特性矩阵见 ci.yml。
event = ["std"]
async-seam = ["std"]
telemetry = []

# ── 性能基准（构建用例，保留）：衡量不同载体的时空成本 ──────────────
[[bench]]
name = "carrier"
harness = false

[[bench]]
name = "dynamic_tax"
harness = false

[[bench]]
name = "profile_workloads"
harness = false
