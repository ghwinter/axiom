[package]
name = "axiom-runtime"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "axiom 的物理层实现用例（载体 Carrier）：为四构件编译期核心（cell_core）提供'值如何跨连接流动'的多种可替换物理方案——栈上函数传(Inline)、堆队列/通道(Queue)、编译期展开(Direct)。模块化、可替换，作为未来 axiom-tokio 等第三方物理适配器的模板。"
license = "MIT"
repository = "https://github.com/ghwinter/axiom"
homepage = "https://github.com/ghwinter/axiom"
documentation = "https://docs.rs/axiom-runtime"
keywords = ["dataflow", "carrier", "zero-cost", "compile-time", "execution"]
categories = ["concurrency", "rust-patterns", "embedded"]

[dependencies]
# 默认 no_std：runtime 的 `std` feature 显式映射 `axiom/std`，使 "no_std 组合" 在依赖层闭环。
axiom = { path = "..", version = "0.3.0", default-features = false }

[features]
default = ["std"]
std = ["axiom/std"]

# ── 性能基准（构建用例，保留）：衡量不同载体的时空成本 ──────────────
[[bench]]
name = "carrier"
harness = false
