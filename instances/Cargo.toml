[package]
name = "axiom-instances"
version = "0.3.0"
edition = "2024"
# Edition 2024 stabilized in Rust 1.85 (Feb 2025); matches core/runtime.
rust-version = "1.98"
description = "axiom instance layer: replaceable physical implementations plugged in through the sockets (Executor/Carrier/Telemetry). The official standard set is one fused crate with feature gating (tokio), all off by default; third parties may self-build separate crates via the open path (dual-form boundary, instance-layer-design §3)."
license = "MIT"
repository = "https://github.com/ghwinter/axiom"
homepage = "https://github.com/ghwinter/axiom"
documentation = "https://docs.rs/axiom-instances"
keywords = ["dataflow", "carrier", "zero-cost", "compile-time", "executor", "tokio"]
categories = ["concurrency", "asynchronous", "rust-patterns"]

[dependencies]
# Dependency direction is one-way: core(semantics) ← instances, per the
# workspace M6 composition law.
# default-features=false: the default is <no instances> — instance features
# are gated (all off by default), pulling only the needed seams; no implicit
# enablement of semantics' idle default carrier family.
axiom = { path = "../core", version = "0.3.0", default-features = false }
axiom-semantics = { path = "../semantics", version = "0.3.0", default-features = false }

# ── Instance-layer feature gates (all off by default, as ruled) ─────────────
#   default = []             (empty instance face: legal, no replacement happens)
#   async   = pulls semantics' async seam (Executor/SeamPoller)
#   tokio   = async + optional external dep tokio (a real external dep, in the
#             graph only when enabled)
#   embedded= reserved embedded flow (no external deps; side effect: enables
#             semantics std)
[features]
default = []
async = ["axiom-semantics/async-seam"]
tokio = ["async", "dep:tokio"]
embedded = ["axiom-semantics/std"]  # reserved: embedded-flow adaptation (to land later)
# tracing observation sink: the Telemetry contract's second implementer
# (first: in-tree semantics Console/Buf).
# Pulls the semantics telemetry feature + optional dep tracing; the output
# destination is the subscriber's decision (the print-vs-observe boundary,
# mechanized).
telemetry-tracing = ["axiom-semantics/telemetry", "dep:tracing"]

[dependencies.tracing]
version = "0.1"
optional = true
# std: required by `with_default` (test capture subscriber); tracing's default
# feature set.
features = ["std"]

[dependencies.tokio]
version = "1"
optional = true
default-features = false
features = ["time", "rt-multi-thread", "sync"]  # time: deadline semantics; rt-multi-thread: multithreaded Runtime::new; sync: mpsc feeding (tokio_poll_fed). Does not pull the full IO/net set