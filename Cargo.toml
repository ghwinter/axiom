# ── Workspace root (instance-layer shape; instance-layer-design) ────────────
# One-way dependency across the three constituents:
# axiom ← axiom-semantics ← axiom-instances; examples/ is the namespace for
# cross-layer use cases (one crate per use case; first: examples/sql-over-redis,
# depending on all three constituents).
# core is the core-abstraction package (standard src/ layout), a sibling member
# alongside semantics/ and instances/; the comprehensive-use-case face at the
# repository root = examples/ (plus each member's own examples/).
# Dependency direction is enforced one-way by the member table; any reverse
# dependency (semantics/instances depending on external instances of core/) is
# an M6 non-composable object and is rejected.
[workspace]
resolver = "2"
members = ["core", "semantics", "instances", "examples/sql-over-redis"]