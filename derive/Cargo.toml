[package]
name = "axiom-derive"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Procedural macros for axiom: auto-generate PortSet, Input/Output enums, and HasPortInfo impls from a single struct declaration."
license = "MIT"
repository = "https://github.com/ghwinter/axiom"
homepage = "https://github.com/ghwinter/axiom"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
