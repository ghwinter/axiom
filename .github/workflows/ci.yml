# Minimal CI for axiom: lint + test + no_std build, on both dev platforms.
#
# Bench gates (A2, E1 automation):
# - Compile gate: `cargo bench --no-run` — release benches must compile
#   against the current API.
# - Threshold gate: `dynamic_tax` asserts the erased-seam per-touch tax stays
#   under `DYNAMIC_TAX_MAX_NS_OP` (C14-A2 hook; min-of-N + self-noise floor).
#   The threshold is deliberately loose (≥10× the stable reading) so shared-
#   runner jitter cannot flake the gate, while catastrophic regressions
#   (per-touch allocation / indirection) still fail.
# Deliberately NOT included (yet):
# - Micro-drift comparison for `carrier` / `profile_workloads`: still manual
#   (`cargo bench`, see benches/bench_common.rs and CHANGELOG C9 notes) —
#   run manually when a zero-cost claim needs re-evidence.
# - `evidence/run.sh|ps1`: probe corpus TRIAGED (2026-08, see evidence/README.md
#   "triage"); survivors E100/R001/R002 are carried by the no_std build, the
#   topology determinism test, and the dynamic_tax bench respectively; the
#   rest reference the removed v0 API and stay archived (gitignored). No
#   standalone probe script is wired in.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Lint: zero-warning gate over all targets. Workspace covers
      # axiom + axiom-semantics + axiom-instances (default no-feature);
      # the instances tokio feature is clipped separately (feature-gated code).
      - name: Clippy (all targets, deny warnings)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p axiom-instances --all-targets --features tokio -- -D warnings
          cargo clippy -p axiom-demo-sql-over-redis --all-targets --features tokio -- -D warnings
          cargo clippy -p axiom-demo-sql-over-redis --all-targets --features turmoil -- -D warnings

      # Tests: workspace (core + semantics unit/integration); instances feature tests.
      # The use-case crate is exercised in both network domains: tokio = actual
      # sockets (tcp_t6_crosscheck), turmoil = deterministic simulation
      # (tcp_sim_adversarial, adversarial invariants; needs the simulation host).
      - name: Test
        run: |
          cargo test --workspace
          cargo test -p axiom-instances --features tokio
          cargo test -p axiom-demo-sql-over-redis --features tokio
          cargo test -p axiom-demo-sql-over-redis --features turmoil

      # Doc drift gate (C11): every ```rust block in formal docs must compile
      # against the current API. Ignore list: tmp/docgate-ignore.txt.
      - name: Docgate (docs rust blocks compile)
        run: cargo test -p axiom-semantics --test docgate -- --ignored

      # no_std promise: core and semantics build without std (instance/demos
      # layers do not participate — their tokio/embedded instances need std).
      - name: Build no_std
        run: |
          cargo build -p axiom --no-default-features
          cargo build -p axiom-semantics --no-default-features

      # Bench gates (A2, E1 automation): compile gate + threshold gate. The
      # threshold uses the C14-A2 hook already in dynamic_tax.rs: per-touch tax
      # of the erased seams must stay under DYNAMIC_TAX_MAX_NS_OP. Loose on
      # purpose (shared runners jitter; min-of-N absorbs noise) — this is a
      # catastrophe gate, not a micro-drift gate.
      - name: Bench compile (release)
        run: cargo bench --no-run -p axiom-semantics

      - name: Bench threshold (dynamic_tax, release)
        env:
          DYNAMIC_TAX_MAX_NS_OP: "25"
        run: cargo bench -p axiom-semantics --bench dynamic_tax

      # Feature matrix (convergence 2026-08): seam-family features must each
      # compile standalone against the core family — prevents gate rot
      # (no-default-features + one feature at a time). Extended to the
      # instance layer: each instance feature compiles standalone (all-off
      # default is the legal empty instance face).
      - name: Feature matrix compile
        run: |
          cargo build -p axiom-semantics --no-default-features --features telemetry
          cargo build -p axiom-semantics --no-default-features --features event
          cargo build -p axiom-semantics --no-default-features --features async-seam
          cargo build -p axiom-instances --no-default-features --features async
          cargo build -p axiom-instances --no-default-features --features tokio
          cargo build -p axiom-instances --no-default-features --features embedded
          cargo build -p axiom-demo-sql-over-redis --no-default-features
          cargo build -p axiom-demo-sql-over-redis --no-default-features --features tokio
          cargo build -p axiom-demo-sql-over-redis --no-default-features --features turmoil
