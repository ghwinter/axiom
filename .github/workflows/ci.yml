# Minimal CI for axiom: lint + test + no_std build, on both dev platforms.
#
# Deliberately NOT included (yet):
# - `cargo bench`: release-only evidence; benches self-skip under debug and
#   timing gates are flaky on shared runners. Run `cargo bench` manually when
#   a zero-cost claim needs re-evidence.
# - `evidence/run.sh|ps1`: probe corpus TRIAGED (2026-08, see evidence/README.md
#   "分诊"); survivors E100/R001/R002 are carried by the no_std build, the
#   topology determinism test, and the dynamic_tax bench respectively; the
#   rest reference the removed v0 API and stay archived (gitignored). No
#   standalone probe script is wired in.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Lint: zero-warning gate over all targets. Workspace covers
      # axiom + axiom-runtime + axiom-instances (default no-feature);
      # the instances tokio feature is clipped separately (feature-gated code).
      - name: Clippy (all targets, deny warnings)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p axiom-instances --all-targets --features tokio -- -D warnings

      # Tests: workspace (core + runtime unit/integration); instances feature tests.
      - name: Test
        run: |
          cargo test --workspace
          cargo test -p axiom-instances --features tokio

      # Doc drift gate (C11): every ```rust block in formal docs must compile
      # against the current API. Ignore list: tmp/docgate-ignore.txt.
      - name: Docgate (docs rust blocks compile)
        run: cargo test -p axiom-runtime --test docgate -- --ignored

      # no_std promise: core and runtime build without std (instance layer
      # does not participate in no_std — its tokio/embedded instances need std).
      - name: Build no_std
        run: |
          cargo build -p axiom --no-default-features
          cargo build -p axiom-runtime --no-default-features

      # Bench compile gate (A2, partial): release benches must compile against the
      # current API. Threshold comparison (E1 automation) stays manual on shared
      # runners — timing gates are flaky; run `cargo bench` with the noise-floor
      # method (min-of-N + self-noise floor) when a zero-cost claim needs
      # re-evidence (see benches/bench_common.rs and CHANGELOG C9 notes).
      - name: Bench compile (release)
        run: cargo bench --no-run -p axiom-runtime

      # Feature matrix (convergence 2026-08): seam-family features must each
      # compile standalone against the core family — prevents gate rot
      # (no-default-features + one feature at a time). Extended to the
      # instance layer: each instance feature compiles standalone (all-off
      # default is the legal empty instance face).
      - name: Feature matrix compile
        run: |
          cargo build -p axiom-runtime --no-default-features --features telemetry
          cargo build -p axiom-runtime --no-default-features --features event
          cargo build -p axiom-runtime --no-default-features --features async-seam
          cargo build -p axiom-instances --no-default-features --features async
          cargo build -p axiom-instances --no-default-features --features tokio
          cargo build -p axiom-instances --no-default-features --features embedded
