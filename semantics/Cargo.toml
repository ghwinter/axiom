[package]
name = "axiom-semantics"
version = "0.3.0"
# The semantics-functor layer (⟦core shape category⟧ → behavior category):
# renamed from axiom-runtime; R0 landed via the override mapping. This layer
# carries no "execution engine" semantics — it runs nothing; it declares what
# it means for a shape to run on an executing base (behavior/cost/seams),
# fulfilled by axiom-instances. Pre-move authorship retained.
edition = "2024"
rust-version = "1.98"
description = "axiom semantics/contract layer (the semantics functor ⟦·⟧): seams (wait/event/observation), carriers (the space-time cost of how values flow across connections), drivers, wiring checks, and the promise ledger. It executes nothing; behavior and cost contracts are fulfilled by axiom-instances binding to real bases (tokio/io_uring/std/embedded). Modular and replaceable — future third-party physical adapters such as axiom-tokio plug in by implementing this layer's sockets."
license = "Apache-2.0"
repository = "https://github.com/ghwinter/axiom"
homepage = "https://github.com/ghwinter/axiom"
documentation = "https://docs.rs/axiom-semantics"
keywords = ["dataflow", "carrier", "zero-cost", "compile-time", "semantics"]
categories = ["concurrency", "rust-patterns", "embedded"]

[dependencies]
# no_std by default: semantics' `std` feature maps `axiom/std` explicitly, so
# the "no_std composition" promise closes at the dependency layer.
axiom = { path = "../core", version = "0.3.0", default-features = false }

# Compile-time wiring macros (wire!): proc-macro crate, links nothing into the
# produced artifact — the runtime dependency graph stays core-only.
axiom-macros = { path = "../macros", version = "0.3.0" }

# G22: property-testing scaffolding (proptest-state-machine) — dev face only;
# the lib dependency graph carries no runtime dependencies beyond the two above.
# The state_machine sub-crate structurally requires std (note N-G3): scaffolding
# cases land on the std test face only; the no_std-side step laws remain
# handwritten vectors (vacuum #10 partially maintained).
[dev-dependencies]
proptest = "1.11"
proptest-state-machine = "0.8"

[features]
default = ["std", "event", "async-seam", "telemetry"]
std = ["axiom/std"]
# ── Seam-carrier family (structural convergence 2026-08: fine-grained gates
#    + umbrella defaults) ──────────────────────────────────────────────────────
# All on by default (keeps the current compile face); selective consumers may
# use `--no-default-features` to take only the core family (carrier/contract/
# obligation/flow/profile/slot/delivery/law, etc.) or pick a single seam
# feature. Gate discipline: ledger-probe references must share the gate of
# their module (obligation.rs `event::pump_events` follows `event`); the CI
# feature matrix lives in ci.yml.
event = ["std"]
async-seam = ["std"]
telemetry = []

# ── Benchmarks (build use cases, kept): space-time cost across carriers ─────
[[bench]]
name = "carrier"
harness = false

[[bench]]
name = "dynamic_tax"
harness = false

[[bench]]
name = "profile_workloads"
harness = false
