[package]
name = "axiom"
version = "0.3.0"
edition = "2024"
# Edition 2024 was stabilized in Rust 1.85 (Feb 2025). All code also compiles
# on later stable releases; bump only when adopting newer language features.
rust-version = "1.98"
description = "Four-constituent compile-time core: open systems + causal dataflow + composition + staticity declaration. Blueprints are defined in Rust code/types — no JSON or value-form intermediate layer; the model is exhausted at compile time, and the compiled artifact is equivalent to hand-written plain Rust with zero runtime objects. Zero-dependency."
license = "MIT"
readme = "../README.md"
repository = "https://github.com/ghwinter/axiom"
homepage = "https://github.com/ghwinter/axiom"
documentation = "https://docs.rs/axiom"
keywords = ["compile-time", "topology", "dataflow", "zero-cost", "embedding"]
categories = ["concurrency", "rust-patterns", "embedded"]

# Standard package layout: src/ (core abstraction layer; symmetric with
# semantics/src and instances/src). The core is zero-dependency (cell_core
# uses core/alloc only). Legacy dependencies (serde, axiom-derive) and the
# old value-form/flowkind semantics were removed in historical cleanups
# (the old _legacy_v0 directory is gone).
[dependencies]

# ── Feature graph ────────────────────────────────────────────────────────────
#   default ──► std
#   no_std + alloc: `--no-default-features` (cell_core uses core/alloc only).
[features]
default = ["std"]
std = []

# ── Benchmarks (build use cases, kept) ──────────────────────────────────────
# Minimal built-in timing harness (zero external dev-deps, per the
# zero-dependency philosophy).
[[bench]]
name = "chain"
harness = false

# Second shape of the zero-cost comparison: diamond (serial-then-parallel)
# generic path vs handwritten vs type-erased.
[[bench]]
name = "dag"
harness = false
